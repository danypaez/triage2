<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Triage IA</title>

<style>
body {
    font-family: Arial;
    background: linear-gradient(135deg, #0f1720, #020617);
    color: white;
    text-align: center;
    padding-top: 40px;
}

.container { width: 520px; margin: auto; }

input, textarea {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    border-radius: 8px;
}

button {
    margin-top: 10px;
    padding: 10px;
    border-radius: 8px;
    background: #00c6ff;
    color: white;
    border: none;
    cursor: pointer;
}

.box {
    margin-top: 20px;
    padding: 15px;
    background: rgba(255,255,255,0.08);
    border-radius: 10px;
}
</style>
</head>

<body>

<div class="container">

<h2>🏥 Triage IA</h2>

<input id="nombre" placeholder="Nombre">
<button onclick="okNombre()">OK</button>

<input id="dni" placeholder="DNI" disabled>
<button onclick="okDni()" id="btnDni" disabled>OK</button>

<textarea id="texto" placeholder="Síntomas" disabled></textarea>
<button onclick="enviar()" id="btnEnviar" disabled>Evaluar</button>

<div id="resultado" class="box"></div>

</div>

<script>

let nombre="", dni="";

function okNombre(){
    nombre=document.getElementById("nombre").value;
    document.getElementById("dni").disabled=false;
}

function okDni(){
    dni=document.getElementById("dni").value;
    document.getElementById("texto").disabled=false;
    document.getElementById("btnEnviar").disabled=false;
}

async function enviar(){

    const texto=document.getElementById("texto").value;

    const res=await fetch("/triage",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({texto})
    });

    const data=await res.json();

    window.medicos=data.medicos;
    window.base={nombre,dni,sintomas:texto,especialidad:data.especialidad};

    let html=`<h3>${data.especialidad}</h3>`;

    data.medicos.forEach((m,i)=>{
        html+=`<button onclick="medico(${i})">${m.doctor}</button>`;
    });

    document.getElementById("resultado").innerHTML=html;
}

function medico(i){

    const m=window.medicos[i];

    window.turno={
        ...window.base,
        doctor:m.doctor
    };

    let html=`<h3>${m.doctor}</h3>`;

    m.turnos.forEach(t=>{
        html+=`<button onclick="confirmar('${t}')">${t}</button>`;
    });

    document.getElementById("resultado").innerHTML=html;
}

async function confirmar(fecha){

    const res=await fetch("/confirmar",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            ...window.turno,
            fecha:fecha.trim()
        })
    });

    const r=await res.json();

    if(r.ok){
        document.getElementById("resultado").innerHTML=
        `<h3>Turno confirmado</h3>
         <p>${window.turno.doctor} - ${fecha}</p>`;
    } else {
        alert(r.error || "Error");
    }
}

</script>

</body>
</html>
