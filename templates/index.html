<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Triage IA Premium</title>

<style>
body {
    font-family: Arial;
    background: linear-gradient(135deg, #0f1720, #020617);
    color: white;
    text-align: center;
    padding-top: 40px;
}

.container {
    width: 520px;
    margin: auto;
}

textarea, input {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    border-radius: 8px;
    border: none;
}

button {
    margin-top: 10px;
    padding: 10px;
    border: none;
    border-radius: 8px;
    background: #00c6ff;
    color: white;
    cursor: pointer;
}

.box {
    margin-top: 20px;
    padding: 15px;
    background: rgba(255,255,255,0.08);
    border-radius: 10px;
}

.perfil {
    margin-top: 50px;
}

.foto {
    width: 150px;
    border-radius: 50%;
    border: 3px solid #00c6ff;
}
</style>
</head>

<body>

<div class="container">

<h2>🏥 Triage IA</h2>

<input id="nombre" placeholder="Nombre y apellido">
<button onclick="okNombre()">OK</button>

<input id="dni" placeholder="DNI" disabled>
<button onclick="okDni()" id="btnDni" disabled>OK</button>

<textarea id="texto" placeholder="Síntomas" disabled></textarea>
<button onclick="enviar()" id="btnEnviar" disabled>Evaluar</button>

<div id="resultado" class="box"></div>

</div>

<div class="perfil">
    <img src="/static/doctor.png" class="foto">
    <h3>Doctor Cacarulo</h3>
    <p>Director Ejecutivo</p>
    <p>Sanatorio "Directo al Cielo"</p>
</div>

<script>

// VOZ
let voz = null;

function cargarVoces(){
    const voces = speechSynthesis.getVoices();
    voz = voces.find(v => v.lang.startsWith("es")) || voces[0];
}
speechSynthesis.onvoiceschanged = cargarVoces;

function hablar(t){
    const m = new SpeechSynthesisUtterance(t);
    m.voice = voz;
    m.rate = 0.85;
    speechSynthesis.cancel();
    setTimeout(()=>speechSynthesis.speak(m),150);
}

// FLUJO
let nombre="", dni="";

function okNombre(){
    nombre = document.getElementById("nombre").value;
    document.getElementById("dni").disabled=false;
    document.getElementById("btnDni").disabled=false;
    hablar(`${nombre}, indique su DNI.`);
}

function okDni(){
    dni = document.getElementById("dni").value;
    document.getElementById("texto").disabled=false;
    document.getElementById("btnEnviar").disabled=false;
    hablar(`${nombre}, indique sus síntomas.`);
}

// FECHA COMPLETA
function fechaCompleta(f){

    const [fecha,hora]=f.split(" ");
    const [d,m]=fecha.split("/");

    const date=new Date(2026,m-1,d);

    const dias=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
    const meses=["enero","febrero","marzo","abril","mayo","junio",
    "julio","agosto","septiembre","octubre","noviembre","diciembre"];

    return `${dias[date.getDay()]} ${d} de ${meses[m-1]} a las ${hora}`;
}

// TRIAGE
async function enviar(){

    const texto = document.getElementById("texto").value;

    const res = await fetch("/triage",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({texto})
    });

    const data = await res.json();

    if(data.alerta){
        hablar(data.alerta);
        return;
    }

    window.baseData={nombre,dni,sintomas:texto,especialidad:data.especialidad};

    let html=`<p><b>${data.especialidad}</b></p>`;
    html+=`<ul>${data.recomendaciones.map(r=>`<li>${r}</li>`).join("")}</ul>`;
    html+=`<h3>Seleccione médico</h3>`;

    data.medicos.forEach((m,i)=>{
        html+=`<button onclick="seleccionarMedico(${i})">${m.doctor}</button>`;
    });

    document.getElementById("resultado").innerHTML=html;

    const recomendaciones = data.recomendaciones.join(". ") + ".";

    hablar(`${nombre}. Se recomienda ${data.especialidad}.
    Puede atenderse con ${data.medicos.map(m=>m.doctor).join(" o ")}.
    Recomendaciones importantes: ${recomendaciones}`);
    
    window.medicos=data.medicos;
}

// SELECCION MÉDICO
function seleccionarMedico(i){

    const m=window.medicos[i];

    window.turnoData={...window.baseData, doctor:m.doctor};

    let html=`<h3>${m.doctor}</h3>`;

    m.turnos.forEach(t=>{
        html+=`<button onclick="confirmar('${t}')">${t}</button>`;
    });

    document.getElementById("resultado").innerHTML=html;

    hablar(`Seleccionó ${m.doctor}. Elija un turno.`);
}

// CONFIRMAR
async function confirmar(fecha){

    const res=await fetch("/confirmar",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({...window.turnoData, fecha})
    });

    const r=await res.json();

    if(r.ok){

        const f = fechaCompleta(fecha);

        hablar(`${nombre}. Turno confirmado con ${window.turnoData.doctor}.
        Fecha: ${f}.`);

        document.getElementById("resultado").innerHTML=
            `<h3>Turno confirmado</h3><p>${window.turnoData.doctor} - ${f}</p>`;
    }
}

// INICIO
window.onload=()=>{
    cargarVoces();
    hablar("Bienvenido. Indique su nombre.");
};

</script>

</body>
</html>
