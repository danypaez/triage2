<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dios Adentro Dios Afuera</title>

<link rel="stylesheet" href="/static/style.css">

</head>

<body>

<div class="container">

    <div class="header">

        <img src="/static/logo.webp" class="logo">

        <h1>DIOS ADENTRO DIOS AFUERA</h1>

        <p>
            Un espacio de contemplación, reflexión y conciencia.
        </p>

        <a
            href="https://diosadentrodiosafuera.com.ar/"
            target="_blank"
            class="sitio"
        >
            diosadentrodiosafuera.com.ar
        </a>

    </div>

    <div id="chat"></div>

    <div class="panel">

        <input
            type="text"
            id="input"
            placeholder="Compartí aquello que deseás expresar..."
            onkeypress="if(event.key==='Enter') enviar()"
        >

        <button onclick="enviar()">
            Enviar
        </button>

    </div>

    <div id="acciones" class="acciones" style="display:none;">

        <button onclick="otraConsulta()">
            Otra consulta
        </button>

        <button onclick="finalizarChat()">
            Finalizar
        </button>

    </div>

</div>

<audio id="audio"></audio>

<script src="/static/script.js"></script>

</body>
</html>
