<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Triage IA Premium</title>

<style>
body {
    font-family: Arial;
    background: linear-gradient(135deg, #0f1720, #020617);
    color: white;
    text-align: center;
    padding-top: 40px;
}

.container {
    width: 520px;
    margin: auto;
}

textarea, input {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    border-radius: 8px;
    border: none;
}

button {
    margin-top: 10px;
    padding: 10px;
    border: none;
    border-radius: 8px;
    background: #00c6ff;
    color: white;
    cursor: pointer;
}

.box {
    margin-top: 20px;
    padding: 15px;
    background: rgba(255,255,255,0.08);
    border-radius: 10px;
}

.perfil {
    margin-top: 50px;
}

.foto {
    width: 150px;
    border-radius: 50%;
    border: 3px solid #00c6ff;
}
</style>
</head>

<body>

<div class="container">

<h2>🏥 Triage IA</h2>

<input id="nombre" placeholder="Nombre y apellido">
<button onclick="okNombre()">OK</button>

<input id="dni" placeholder="DNI" disabled>
<button onclick="okDni()" id="btnDni" disabled>OK</button>

<textarea id="texto" placeholder="Síntomas" disabled></textarea>
<button onclick="enviar()" id="btnEnviar" disabled>Evaluar</button>

<div id="resultado" class="box"></div>

</div>

<div class="perfil">
    <img src="/static/doctor.png" class="foto">
    <h3>Doctor Cacarulo</h3>
    <p>Director Ejecutivo</p>
    <p>Sanatorio "Directo al Cielo"</p>
</div>

<script>

let nombre = "";
let dni = "";
let voz = null;

function cargarVoces(){
    const voces = speechSynthesis.getVoices();
    voz = voces.find(v => v.lang.startsWith("es")) || voces[0];
}
speechSynthesis.onvoiceschanged = cargarVoces;

function hablar(t){
    const m = new SpeechSynthesisUtterance(t);
    m.voice = voz;
    m.rate = 0.9;
    speechSynthesis.cancel();
    setTimeout(() => speechSynthesis.speak(m), 150);
}

// =========================
// FLUJO PACIENTE
// =========================
function okNombre(){
    nombre = document.getElementById("nombre").value;

    document.getElementById("dni").disabled = false;
    document.getElementById("btnDni").disabled = false;

    hablar(`${nombre}, indique su DNI`);
}

function okDni(){
    dni = document.getElementById("dni").value;

    document.getElementById("texto").disabled = false;
    document.getElementById("btnEnviar").disabled = false;

    hablar(`${nombre}, indique sus síntomas`);
}

// =========================
// TRIAGE REQUEST
// =========================
async function enviar(){

    const texto = document.getElementById("texto").value;

    const res = await fetch("/triage", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ texto })
    });

    const data = await res.json();

    if (!data.ok) {
        document.getElementById("resultado").innerHTML = "<p>Error en el sistema</p>";
        return;
    }

    window.baseData = {
        nombre,
        dni,
        sintomas: texto,
        especialidad: data.especialidad
    };

    window.medicos = data.medicos;

    let html = `<p><b>${data.especialidad}</b></p>`;

    html += `<ul>
        ${data.recomendaciones.map(r => `<li>${r}</li>`).join("")}
    </ul>`;

    html += `<h3>Seleccione médico</h3>`;

    // FIX IMPORTANTE: ahora medicos es objeto {doctor, turnos}
    data.medicos.forEach((m, i) => {
        html += `<button onclick="seleccionarMedico(${i})">${m.doctor}</button>`;
    });

    document.getElementById("resultado").innerHTML = html;

    hablar(`Especialidad detectada: ${data.especialidad}`);
}

// =========================
// SELECCION MÉDICO
// =========================
function seleccionarMedico(i){

    const medico = window.medicos[i];

    window.turnoData = {
        ...window.baseData,
        doctor: medico.doctor
    };

    let html = `<h3>${medico.doctor}</h3>`;
    html += `<p>Seleccione horario</p>`;

    medico.turnos.forEach(t => {
        html += `<button onclick="confirmar('${t}')">${t}</button>`;
    });

    document.getElementById("resultado").innerHTML = html;

    hablar(`Seleccione horario con ${medico.doctor}`);
}

// =========================
// CONFIRMAR TURNO
// =========================
async function confirmar(fecha){

    const res = await fetch("/confirmar", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            ...window.turnoData,
            fecha
        })
    });

    const r = await res.json();

    if (r.ok) {
        hablar("Turno confirmado correctamente");

        document.getElementById("resultado").innerHTML =
            `<h3>Turno confirmado</h3>
             <p><b>${window.turnoData.doctor}</b></p>
             <p>${fecha}</p>`;
    } else {
        hablar("Error al confirmar turno");
    }
}

// INIT
window.onload = () => {
    cargarVoces();
    hablar("Bienvenido, indique su nombre");
};

</script>

</body>
</html>
