<!DOCTYPE html>
<html>
<head>
    <title>Triage Médico</title>
</head>
<body>

<h2>Ingresá tus síntomas</h2>

<textarea id="sintomas" rows="5" cols="50"></textarea><br><br>

<button onclick="enviar()">Analizar</button>

<div id="resultado"></div>

<script>
async function enviar() {

    const texto = document.getElementById("sintomas").value;

    const res = await fetch("/triage", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ texto })
    });

    const data = await res.json();

    console.log(data);

    const div = document.getElementById("resultado");
    div.innerHTML = "";

    div.innerHTML += `<h3>Especialidad: ${data.especialidad}</h3>`;
    div.innerHTML += `<h4>Urgencia: ${data.urgencia}</h4>`;

    if (data.recomendaciones && Array.isArray(data.recomendaciones)) {
        data.recomendaciones.forEach(r => {
            div.innerHTML += `<p>• ${r}</p>`;
        });
    }
}
</script>

</body>
</html>
