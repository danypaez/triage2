<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Triage IA Premium</title>

<style>
body {
    font-family: Arial;
    background: linear-gradient(135deg, #0f1720, #020617);
    color: white;
    text-align: center;
    padding-top: 40px;
}

.container {
    width: 520px;
    margin: auto;
}

textarea, input {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    border-radius: 8px;
    border: none;
}

button {
    margin-top: 10px;
    padding: 10px;
    border: none;
    border-radius: 8px;
    background: #00c6ff;
    color: white;
    cursor: pointer;
}

.box {
    margin-top: 20px;
    padding: 15px;
    background: rgba(255,255,255,0.08);
    border-radius: 10px;
}

.perfil {
    margin-top: 50px;
}

.foto {
    width: 150px;
    border-radius: 50%;
    border: 3px solid #00c6ff;
}
</style>
</head>

<body>

<div class="container">

<h2>🏥 Triage IA</h2>

<input id="nombre" placeholder="Nombre y apellido">
<button onclick="okNombre()">OK</button>

<input id="dni" placeholder="DNI" disabled>
<button onclick="okDni()" id="btnDni" disabled>OK</button>

<textarea id="texto" placeholder="Síntomas" disabled></textarea>
<button onclick="enviar()" id="btnEnviar" disabled>Evaluar</button>

<div id="resultado" class="box"></div>

</div>

<div class="perfil">
    <img src="/static/doctor.png" class="foto">
    <h3>Doctor Cacarulo</h3>
    <p>Director Ejecutivo</p>
    <p>Sanatorio "Directo al Cielo"</p>
</div>

<script>

let nombre="", dni="";
let voz=null;

// =========================
// VOZ (RESTAURADA CORRECTA)
// =========================
function cargarVoces(){
    const voces = speechSynthesis.getVoices();
    voz = voces.find(v => v.lang.includes("es")) || voces[0];
}
speechSynthesis.onvoiceschanged = cargarVoces;

function hablar(texto){
    if(!texto) return;

    const msg = new SpeechSynthesisUtterance(texto);
    msg.voice = voz;
    msg.rate = 0.95;
    msg.pitch = 1;

    speechSynthesis.cancel();
    setTimeout(()=>speechSynthesis.speak(msg), 100);
}

// =========================
// FLUJO ORIGINAL
// =========================
function okNombre(){
    nombre = document.getElementById("nombre").value;

    document.getElementById("dni").disabled = false;
    document.getElementById("btnDni").disabled = false;

    hablar(`${nombre}, indique su DNI`);
}

function okDni(){
    dni = document.getElementById("dni").value;

    document.getElementById("texto").disabled = false;
    document.getElementById("btnEnviar").disabled = false;

    hablar(`${nombre}, indique sus síntomas`);
}

// =========================
// TRIAGE
// =========================
async function enviar(){

    const texto = document.getElementById("texto").value;

    const res = await fetch("/triage",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({texto})
    });

    const data = await res.json();

    if(!data.ok){
        hablar("Error al procesar");
        return;
    }

    window.baseData = {
        nombre,
        dni,
        sintomas: texto,
        especialidad: data.especialidad
    };

    window.medicos = data.medicos || [];

    let html = `<p><b>${data.especialidad}</b></p>`;

    if(data.recomendaciones){
        html += `<ul>${data.recomendaciones.map(r=>`<li>${r}</li>`).join("")}</ul>`;
    }

    html += `<h3>Seleccione médico</h3>`;

    window.medicos.forEach((m,i)=>{
        const nombreMedico = m.doctor || m;

        html += `
        <button onclick="seleccionarMedico(${i})">
            ${nombreMedico}
        </button>`;
    });

    document.getElementById("resultado").innerHTML = html;
}

// =========================
// MÉDICO
// =========================
function seleccionarMedico(i){

    const m = window.medicos[i];

    const doctor = m.doctor || m;

    window.turnoData = {
        ...window.baseData,
        doctor
    };

    let html = `<h3>${doctor}</h3>`;
    html += `<p>Seleccione horario:</p>`;

    const turnos = m.turnos || ["09:00","12:00","16:00","18:00"];

    turnos.forEach(t=>{
        html += `<button onclick="confirmar('${t}')">${t}</button>`;
    });

    document.getElementById("resultado").innerHTML = html;
}

// =========================
// CONFIRMAR
// =========================
async function confirmar(fecha){

    const res = await fetch("/confirmar",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            ...window.turnoData,
            fecha: fecha.trim()
        })
    });

    const r = await res.json();

    if(r.ok){
        hablar("Turno confirmado");

        document.getElementById("resultado").innerHTML =
        `<h3>Turno confirmado</h3>
         <p>${window.turnoData.doctor} - ${fecha}</p>`;
    } else {
        hablar(r.error || "Error al confirmar turno");
    }
}

// INIT
window.onload = ()=>{
    cargarVoces();
    hablar("Bienvenido, indique su nombre");
};

</script>

</body>
</html>
