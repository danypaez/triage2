<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Triage Inteligente</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f9;
    margin: 0;
}

.container {
    max-width: 700px;
    margin: 50px auto;
    background: white;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.1);
}

h1 {
    text-align: center;
    color: #2c3e50;
}

textarea {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #ccc;
    resize: none;
    font-size: 15px;
}

button {
    width: 100%;
    padding: 12px;
    background: #3498db;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    margin-top: 10px;
}

button:hover {
    background: #2980b9;
}

.resultado {
    margin-top: 20px;
    padding: 20px;
    border-radius: 10px;
}

.urgencia-ALTA {
    background: #ffe5e5;
    border-left: 5px solid red;
}

.urgencia-MEDIA {
    background: #fff7e0;
    border-left: 5px solid orange;
}

.urgencia-BAJA {
    background: #e8f8f0;
    border-left: 5px solid green;
}

.loader {
    display: none;
    text-align: center;
    margin-top: 15px;
    font-weight: bold;
    color: #555;
}

.recomendacion {
    margin: 5px 0;
    padding: 8px;
    background: #f1f1f1;
    border-radius: 5px;
}
</style>
</head>

<body>

<div class="container">

    <h1>🩺 Triage Médico Inteligente</h1>

    <textarea id="sintomas" rows="5" placeholder="Describí tus síntomas..."></textarea>

    <button onclick="enviar()">Analizar síntomas</button>

    <div class="loader" id="loader">
        ⏳ Analizando con IA...
    </div>

    <div id="resultado"></div>

</div>

<script>
async function enviar() {

    const texto = document.getElementById("sintomas").value;
    const loader = document.getElementById("loader");
    const div = document.getElementById("resultado");

    if (!texto) {
        alert("Escribí algún síntoma");
        return;
    }

    div.innerHTML = "";
    loader.style.display = "block";

    try {

        const res = await fetch("/triage", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ texto })
        });

        if (!res.ok) {
            throw new Error("Error servidor");
        }

        const data = await res.json();

        loader.style.display = "none";

        console.log("Respuesta:", data);

        const urgenciaClass = "urgencia-" + data.urgencia;

        let html = `
            <div class="resultado ${urgenciaClass}">
                <h3>Especialidad: ${data.especialidad}</h3>
                <h4>Urgencia: ${data.urgencia}</h4>
                <hr>
                <h4>Recomendaciones:</h4>
        `;

        if (data.recomendaciones && Array.isArray(data.recomendaciones)) {
            data.recomendaciones.forEach(r => {
                html += `<div class="recomendacion">• ${r}</div>`;
            });
        } else {
            html += `<p>No hay recomendaciones disponibles</p>`;
        }

        html += `</div>`;

        div.innerHTML = html;

    } catch (err) {
        loader.style.display = "none";

        div.innerHTML = `
            <div class="resultado urgencia-MEDIA">
                <h3>Error</h3>
                <p>No se pudo procesar la solicitud.</p>
            </div>
        `;

        console.error(err);
    }
}
</script>

</body>
</html>
