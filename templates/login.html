<!DOCTYPE html>
<html>
<head>
    <title>Login Médico</title>

    <style>
        body {
            font-family: Arial;
            background: #007bff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 300px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #007bff;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

<div class="login">
    <h2>Login Médico</h2>

    <form method="POST">
        <input name="user" placeholder="Usuario">
        <input name="password" type="password" placeholder="Contraseña">
        <button>Ingresar</button>
    </form>
</div>

</body>
</html>
