<!DOCTYPE html>
<html>
<head>
<title>Login</title>
<style>
body {background:#020617;color:white;text-align:center;font-family:Arial;}
.box {margin-top:100px;}
input,button {padding:10px;margin:5px;border-radius:8px;border:none;}
button {background:#00c6ff;color:white;}
</style>
</head>
<body>

<div class="box">
<h2>Login Médico</h2>
<form method="POST">
<input name="user" placeholder="Usuario"><br>
<input name="pass" type="password" placeholder="Contraseña"><br>
<button>Ingresar</button>
</form>
</div>

</body>
</html>
