<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Calendario de Turnos</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f9;
}

header {
    background: #4facfe;
    color: white;
    padding: 15px;
    text-align: center;
    font-size: 22px;
    font-weight: bold;
}

.container {
    padding: 30px;
}

.top-bar {
    display: flex;
    justify-content: space-between;
    margin-bottom: 20px;
    flex-wrap: wrap;
}

select {
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
    min-width: 200px;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

th {
    background: #4facfe;
    color: white;
    padding: 12px;
    font-size: 14px;
}

td {
    padding: 12px;
    border-bottom: 1px solid #eee;
    text-align: center;
    vertical-align: top;
}

td:nth-child(3) {
    text-align: left;
    max-width: 300px;
    font-size: 14px;
    color: #555;
}

tr:hover {
    background: #f1f7ff;
}

.badge {
    padding: 6px 10px;
    border-radius: 6px;
    color: white;
    font-size: 12px;
    display: inline-block;
}

.dr {
    background: #28a745;
}

.empty {
    text-align: center;
    margin-top: 40px;
    color: #777;
    font-size: 16px;
}

/* Responsive */
@media (max-width: 768px) {
    table, thead, tbody, th, td, tr {
        display: block;
    }

    tr {
        margin-bottom: 15px;
        background: white;
        border-radius: 10px;
        padding: 10px;
    }

    th {
        display: none;
    }

    td {
        text-align: left;
        padding: 8px;
        border: none;
    }

    td::before {
        font-weight: bold;
        display: block;
        margin-bottom: 3px;
    }

    td:nth-child(1)::before { content: "Paciente"; }
    td:nth-child(2)::before { content: "DNI"; }
    td:nth-child(3)::before { content: "Síntomas"; }
    td:nth-child(4)::before { content: "Médico"; }
    td:nth-child(5)::before { content: "Fecha"; }
}
</style>

</head>

<body>

<header>
📅 Gestión de Turnos Médicos
</header>

<div class="container">

<div class="top-bar">

    <!-- FILTRO POR MÉDICO -->
    <form method="GET" action="/calendario">
        <select name="doctor" onchange="this.form.submit()">
            <option value="">Todos los médicos</option>

            {% for m in medicos %}
                <option value="{{ m }}" {% if doctor_actual == m %}selected{% endif %}>
                    {{ m }}
                </option>
            {% endfor %}
        </select>
    </form>

</div>

{% if turnos %}
<table>
<tr>
    <th>Paciente</th>
    <th>DNI</th>
    <th>Síntomas</th>
    <th>Médico</th>
    <th>Fecha</th>
</tr>

{% for t in turnos %}
<tr>
    <td>{{ t[0] }}</td>
    <td>{{ t[1] }}</td>
    <td>{{ t[2] }}</td>
    <td><span class="badge dr">{{ t[3] }}</span></td>
    <td>{{ t[4] }}</td>
</tr>
{% endfor %}
</table>

{% else %}
<div class="empty">
No hay turnos cargados
</div>
{% endif %}

</div>

</body>
</html>
